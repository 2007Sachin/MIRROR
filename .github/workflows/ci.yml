name: CI

# Deterministic verification only: no secrets, no network calls to model providers, no hosted Supabase.
# Every step uses the repository's real commands. A failing step fails the job; nothing is masked.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  MIRROR_LIVE_EVAL: "0"

jobs:
  backend:
    name: Backend, copy lint, AI evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Wrapper exit-code tests (a killed or failing child must never look green)
        run: node --test scripts/exit-code.test.js

      - name: Interview-target web copy and view helpers (pure, Node type stripping)
        run: node --test apps/web/tests/target-copy.test.mjs

      - name: Copy lint
        run: python scripts/copy_lint.py

      # Two invocations so each test runs exactly once and the AI evaluation has its own result.
      # pytest exits 5 when nothing is collected, so an accidentally empty eval suite fails the job.
      - name: Backend and contract tests
        run: python -m pytest -m "not ai_eval"

      - name: AI behavioural evaluation (deterministic, fake providers)
        run: python -m pytest -m ai_eval

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      # Generates route types fresh (next typegen) and type-checks all source. See docs/mirror-company/QUALITY_GATES.md.
      - name: Typecheck
        run: npm --workspace @mirror/web run typecheck

      - name: Production build
        run: npm --workspace @mirror/web run build

  browser:
    name: Browser critical path (isolated, synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The ephemeral, secret-free GitHub-hosted runner IS the isolation boundary; scripts/qa/browser/lib/isolation.mjs
    # verifies that (no credentials, no dotenv, loopback-only URLs) and refuses to run anywhere else.
    # Fake Supabase Auth + fake Mirror API on loopback; real Next production build; system Chrome.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install browser QA harness
        run: npm ci --prefix scripts/qa/browser

      - name: Browser QA safety unit tests (isolation policy, network rail, mock guards)
        run: node --test scripts/qa/browser/tests/safety.test.mjs scripts/qa/browser/tests/mock-safety.test.mjs scripts/qa/browser/tests/network.test.mjs scripts/qa/browser/tests/targets-mock.test.mjs

      - name: Build web against loopback fakes
        run: npm --workspace @mirror/web run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
          NEXT_PUBLIC_SUPABASE_ANON_KEY: qa-sentinel-anon-key
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8099

      - name: Critical path (desktop + mobile)
        run: node scripts/qa/browser/run-ci.mjs
        env:
          MIRROR_QA_GITHUB_HOSTED: "1"
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54399
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8099

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-critical-path
          path: scripts/qa/browser/artifacts
          if-no-files-found: warn
          retention-days: 14
